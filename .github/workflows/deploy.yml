name: Deploy to GitHub Pages

# 手動実行と、動画の棚の新着を反映する毎日の定期実行で公開する。
# main へのpushごとの自動公開を始めるときは下の push トリガーを有効化する（docs/deployment.md 参照）。
on:
  workflow_dispatch:
  schedule:
    # 毎日 6:17（日本時間）。GitHub Actionsの混雑しやすい毎時0分を避ける。
    - cron: '17 21 * * *'
  # push:
  #   branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# 公開中のデプロイは中断せず、後続を待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v6

      # 公開URLとサブパスはGitHub Pagesの設定から取得する（独自ドメイン設定時も自動で追従する）
      # YOUTUBE_API_KEY はビルド時の新着取得にのみ使う。未設定でもビルドは成功する（docs/video-shelf.md）。
      - run: npm run build -- --site "${{ steps.pages.outputs.origin }}" --base "${{ steps.pages.outputs.base_path }}"
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
